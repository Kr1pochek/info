services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    env_file: ${APP_ENV_FILE:-deploy/.env}
    command: ["npm", "run", "db:deploy", "--prefix", "server"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-deploy/.env}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-4000}:4000"
    volumes:
      - uploads_data:/app/server/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
  uploads_data:
